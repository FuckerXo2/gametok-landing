<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Downloading GameTOK...</title>
    <style>
        body {
            background-color: #0d0d14; /* Match landing page dark bg */
            color: #fff;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .container {
            padding: 40px;
        }
        .loader {
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top: 4px solid #a855f7; /* Match landing page purple */
            border-radius: 50%;
            width: 48px;
            height: 48px;
            animation: spin 1s linear infinite;
            margin: 0 auto 24px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        p {
            font-size: 16px;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 24px;
        }
        .btn {
            display: inline-block;
            background: linear-gradient(135deg, #a855f7, #ec4899);
            color: #fff;
            padding: 14px 28px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 700;
            font-size: 15px;
            transition: transform 0.2s;
        }
        .btn:hover {
            transform: translateY(-2px);
        }
        .fallback {
            display: none;
            margin-top: 20px;
        }
    </style>
    <script>
        // Redirect logic 
        window.onload = function() {
            var iosStore = "https://apps.apple.com/app/gametok/id6757498584";
            var androidStore = "https://play.google.com/store/apps/details?id=com.vogeza";
            
            var userAgent = navigator.userAgent || navigator.vendor || window.opera;
            var isIOS = /iPad|iPhone|iPod/.test(userAgent) && !window.MSStream;
            var isAndroid = /android/i.test(userAgent);

            // Give it a tiny delay just to show that the page worked before zipping them to the App Store
            setTimeout(function() {
                var targetUrl = "https://gametok.co/#download";
                
                if (isIOS) {
                    targetUrl = iosStore;
                    document.getElementById('manual-btn').href = iosStore;
                    document.getElementById('manual-btn').innerText = "Open App Store";
                } else if (isAndroid) {
                    targetUrl = androidStore;
                    document.getElementById('manual-btn').href = androidStore;
                    document.getElementById('manual-btn').innerText = "Open Google Play";
                }

                // Show the fallback button in case the redirect is blocked by the in-app browser (e.g. WhatsApp)
                document.getElementById('fallback-container').style.display = 'block';
                document.querySelector('.loader').style.display = 'none';
                document.getElementById('status-text').innerText = "If you are not redirected automatically, tap below:";

                // Attempt the automatic redirect
                window.location.href = targetUrl;
            }, 600);
        };
    </script>
</head>
<body>
    <div class="container">
        <div class="loader"></div>
        <p id="status-text">Taking you to the App Store...</p>
        <div id="fallback-container" class="fallback">
            <a href="#" id="manual-btn" class="btn">Continue</a>
        </div>
    </div>
</body>
</html>
