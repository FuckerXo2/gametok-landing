<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Play on GameTOK</title>
    <style>
        body {
            background-color: #0d0d14;
            color: #fff;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .container {
            padding: 40px;
        }
        .loader {
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top: 4px solid #ffd23f;
            border-radius: 50%;
            width: 48px;
            height: 48px;
            animation: spin 1s linear infinite;
            margin: 0 auto 24px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        p {
            font-size: 16px;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 24px;
        }
        .btn {
            display: inline-block;
            background: #ffd23f;
            color: #111;
            padding: 14px 28px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 700;
            font-size: 15px;
            transition: transform 0.2s;
        }
        .btn:hover {
            transform: translateY(-2px);
        }
        .fallback {
            margin-top: 20px;
        }
    </style>
    <script>
        window.onload = function() {
            setTimeout(function() {
                window.location.replace("https://gametok.co/");
            }, 300);
        };
    </script>
</head>
<body>
    <div class="container">
        <div class="loader"></div>
        <p id="status-text">Taking you to GameTOK...</p>
        <div id="fallback-container" class="fallback">
            <a href="https://gametok.co/" id="manual-btn" class="btn">Play Now in Browser</a>
        </div>
    </div>
    </div>
</body>
</html>
